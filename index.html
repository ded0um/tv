<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Radios</title>
<style>
    :root {
        --bg: #0b1120;
        --surface: #141c33;
        --surface-2: #1b2544;
        --line: #2a3760;
        --text: #f4f6ff;
        --dim: #9aa7cc;
        --accent: #5ce1c6;
        --accent-soft: rgba(92, 225, 198, 0.14);
        --warn: #ffb454;
        --err: #ff7a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: clamp(16px, 1.55vw, 30px); }
    body {
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        padding: 0 4vw 5vh;
        -webkit-tap-highlight-color: transparent;
    }
    body.idle, body.sleeping { cursor: none; }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: inherit; }
    button:focus { outline: none; }

    svg.ico {
        width: 1em; height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
    }

    /* ---------- En-tête ---------- */
    .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: linear-gradient(var(--bg) 84%, rgba(11, 17, 32, 0));
        padding: 2.4vh 0 2.4vh;
    }
    .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 1.6vh;
    }
    .brand {
        display: flex; align-items: center; gap: 0.6rem;
        color: var(--dim);
        font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .brand .ico { font-size: 1.5rem; color: var(--accent); }

    /* Horloge + météo (coin) */
    .corner { display: flex; align-items: center; gap: 1.8rem; }
    .wx { display: flex; align-items: center; gap: 0.6rem; color: var(--dim); }
    .wx[hidden] { display: none; }
    .wx .ico { font-size: 2rem; color: var(--accent); }
    .wx .t { display: flex; flex-direction: column; line-height: 1.15; }
    .wx b { font-size: 1.35rem; color: var(--text); font-weight: 650; }
    .wx small { font-size: 0.8rem; }
    .clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
    .clock b { font-size: 2.2rem; font-weight: 650; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .clock small { font-size: 0.85rem; color: var(--dim); text-transform: capitalize; }

    /* ---------- Lecteur ---------- */
    .player {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.4rem;
        padding: 1rem 1.3rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1.1rem;
    }
    .left { display: flex; align-items: center; gap: 1.2rem; min-width: 0; }
    .art {
        width: 4.8rem; height: 4.8rem;
        border-radius: 0.9rem;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
    }
    .art .ico { font-size: 2.2rem; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .now { min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
    .now-name {
        font-size: 1.8rem; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .now-name.empty { color: var(--dim); font-weight: 500; }
    .track {
        font-size: 1.1rem; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        min-height: 1.4em;
    }
    .track.dim { color: var(--dim); }
    .status { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--dim); }
    .status::before { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--dim); }
    .status.live { color: var(--accent); }
    .status.live::before { background: var(--accent); }
    .status.load { color: var(--warn); }
    .status.load::before { background: var(--warn); animation: pulse 1s infinite alternate; }
    .status.err { color: var(--err); }
    .status.err::before { background: var(--err); }
    @keyframes pulse { to { opacity: 0.25; } }

    .player-right { display: flex; align-items: center; gap: 1.4rem; }
    .eq { display: flex; align-items: flex-end; gap: 4px; height: 1.6rem; }
    .eq i { display: block; width: 5px; height: 4px; border-radius: 3px; background: var(--dim); }
    .eq.on i { background: var(--accent); animation: bounce 0.9s infinite ease-in-out alternate; }
    .eq.on i:nth-child(1) { animation-delay: 0s; }
    .eq.on i:nth-child(2) { animation-delay: 0.35s; }
    .eq.on i:nth-child(3) { animation-delay: 0.15s; }
    .eq.on i:nth-child(4) { animation-delay: 0.5s; }
    .eq.on i:nth-child(5) { animation-delay: 0.25s; }
    @keyframes bounce { from { height: 4px; } to { height: 1.6rem; } }

    .btn-main {
        width: 4.2rem; height: 4.2rem;
        border-radius: 50%;
        border: 2px solid var(--accent);
        color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-size: 1.9rem;
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    /* ---------- Grille ---------- */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 16.5rem), 1fr));
        gap: 1rem;
        padding-top: 0.6vh;
    }
    .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1rem;
        min-height: 6.4rem;
        padding: 0.9rem 1.1rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1rem;
        scroll-margin-top: 17rem;
        scroll-margin-bottom: 3rem;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .logo {
        width: 2.9rem; height: 2.9rem;
        border-radius: 0.8rem;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--dim);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        transition: color 0.15s ease, border-color 0.15s ease;
    }
    .logo .ico { font-size: 1.6rem; }
    .txt { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .card .name { font-size: 1.25rem; font-weight: 650; }
    .card .genre { font-size: 0.82rem; color: var(--dim); }

    .card.playing { background: var(--accent-soft); border-color: rgba(92, 225, 198, 0.55); }
    .card.playing .name { color: var(--accent); }
    .card.playing .logo { color: var(--accent); border-color: rgba(92, 225, 198, 0.55); }

    .card .mini {
        display: none;
        position: absolute; top: 0.8rem; right: 0.9rem;
        align-items: flex-end; gap: 3px; height: 0.9rem;
    }
    .card.playing.live .mini { display: flex; }
    .mini i { display: block; width: 3px; height: 3px; border-radius: 2px; background: var(--accent); animation: mini 0.7s infinite ease-in-out alternate; }
    .mini i:nth-child(2) { animation-delay: 0.25s; }
    .mini i:nth-child(3) { animation-delay: 0.1s; }
    @keyframes mini { from { height: 3px; } to { height: 0.9rem; } }

    /* Focus télécommande */
    .card:focus {
        transform: scale(1.06);
        background: var(--surface-2);
        border-color: var(--text);
        box-shadow: 0 0 0 3px var(--text), 0 1rem 2rem rgba(0, 0, 0, 0.45);
        z-index: 2;
    }
    .card.playing:focus { background: #1c3b45; }
    .card:focus .logo { color: var(--text); }
    .card.playing:focus .logo { color: var(--accent); }
    .btn-main:focus {
        transform: scale(1.12);
        background: var(--accent);
        color: var(--bg);
        box-shadow: 0 0 0 3px var(--text);
    }

    .help {
        display: flex; flex-wrap: wrap; gap: 1.6rem;
        margin-top: 3vh; padding-top: 2vh;
        border-top: 1px solid var(--line);
        color: var(--dim); font-size: 0.85rem;
    }
    .help span { display: inline-flex; align-items: center; gap: 0.5rem; }
    .help .ico { font-size: 1.1rem; }

    /* ---------- Mode veille ---------- */
    .veille {
        position: fixed; inset: 0;
        z-index: 100;
        background: #000;
    }
    .veille[hidden] { display: none; }
    .veille-in {
        position: absolute;
        display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    }
    .veille-time { font-size: 6rem; font-weight: 300; color: #56617f; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
    .veille-name { font-size: 1.5rem; color: #414b68; }

    @media (max-width: 640px) {
        html { font-size: 16px; }
        .corner { gap: 1rem; }
        .clock b { font-size: 1.6rem; }
        .clock small, .wx small { display: none; }
        .wx .ico { font-size: 1.5rem; }
        .player { padding: 0.8rem; }
        .art { width: 3.4rem; height: 3.4rem; }
        .now-name { font-size: 1.25rem; }
        .track { font-size: 0.95rem; }
        .eq { display: none; }
        .grid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
        .card { flex-direction: column; align-items: flex-start; gap: 0.6rem; min-height: 6rem; padding: 0.8rem; scroll-margin-top: 13rem; }
        .card .name { font-size: 1.05rem; }
        .help { display: none; }
        .veille-time { font-size: 4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }
</style>
</head>
<body>

<header class="top">
    <div class="bar">
        <div class="brand" id="brand"></div>
        <div class="corner">
            <div class="wx" id="wx" hidden>
                <svg class="ico" id="wxIco" viewBox="0 0 24 24"></svg>
                <div class="t"><b id="wxTemp"></b><small id="wxRange"></small></div>
            </div>
            <div class="clock"><b id="clockTime">--:--</b><small id="clockDate"></small></div>
        </div>
    </div>

    <div class="player">
        <div class="left">
            <div class="art" id="art"></div>
            <div class="now">
                <div class="now-name empty" id="nowName">Choisissez une station</div>
                <div class="track dim" id="track"></div>
                <div class="status" id="status">Hors ligne</div>
            </div>
        </div>
        <div class="player-right">
            <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
            <button class="btn-main focusable" id="btnMain" aria-label="Lecture / Arrêt">
                <svg class="ico" id="icoPlay" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
                <svg class="ico" id="icoStop" viewBox="0 0 24 24" style="display:none"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
            </button>
        </div>
    </div>
</header>

<main>
    <div class="grid" id="grid" role="list"></div>

    <div class="help">
        <span><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M5 12l4-4M5 12l4 4M19 12l-4-4M19 12l-4 4"/></svg>Flèches : naviguer</span>
        <span><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>OK : écouter</span>
        <span><svg class="ico" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>Lecture / pause : lancer ou arrêter</span>
    </div>
</main>

<!-- Mode veille : écran quasi noir, heure + station -->
<div class="veille" id="veille" hidden>
    <div class="veille-in" id="veilleIn">
        <div class="veille-time" id="veilleTime">--:--</div>
        <div class="veille-name" id="veilleName"></div>
    </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ---------- Réglages ---------- */
const CONFIG = {
    veilleMinutes: 5,                                   // inactivité avant l'écran de veille
    meteo: { lat: 49.96, lon: 2.33 },                   // coordonnées pour la météo (Open-Meteo)
    meteoRafraichirMin: 15
};

/* ---------- Icônes (SVG line-art) ---------- */
const ICONS = {
    radio:  '<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l10-5"/><circle cx="9" cy="14" r="2.5"/><path d="M15 12h3M15 16h3"/>',
    mic:    '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>',
    heart:  '<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>',
    globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
    star:   '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
    pin:    '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    phones: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
    tape:   '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/><path d="M9 16h6"/>',
    bolt:   '<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
    pick:   '<path d="M12 3c5 0 8 3 8 7 0 5-5 11-8 11s-8-6-8-11c0-4 3-7 8-7z"/>',
    notes:  '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/>',
    smile:  '<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5v.5M15 9.5v.5"/>',
    trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M9.5 17h5"/>',
    vinyl:  '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 6a6 6 0 0 1 6 6"/>',
    rocket: '<path d="M12 3c3 2 5 5.5 5 9v3l-2 1.5H9L7 15v-3c0-3.5 2-7 5-9z"/><circle cx="12" cy="10" r="1.8"/><path d="M9 17l-1 4M15 17l1 4"/>'
};
function ico(name) {
    return '<svg class="ico" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.radio) + '</svg>';
}

/* Météo : icônes selon le code WMO */
const WX = {
    sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    part:   '<circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M9 20a3.5 3.5 0 0 1-.3-7A4.8 4.8 0 0 1 18 13a3.5 3.5 0 0 1 0 7z"/>',
    cloud:  '<path d="M7 18a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 8.5 4.5 4.5 0 0 1 17 18z"/>',
    fog:    '<path d="M4 9h16M6 13h12M4 17h16"/>',
    rain:   '<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 5.5 4.5 4.5 0 0 1 17 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    snow:   '<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 5.5 4.5 4.5 0 0 1 17 15z"/><path d="M8 18v.01M12 19v.01M16 18v.01M10 21v.01M14 21v.01"/>',
    storm:  '<path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 5.5 4.5 4.5 0 0 1 17 15z"/><path d="M12 15l-2 3h3l-2 3"/>'
};
function wxKind(c) {
    if (c === 0) return 'sun';
    if (c <= 2) return 'part';
    if (c === 3) return 'cloud';
    if (c === 45 || c === 48) return 'fog';
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
    if (c >= 95) return 'storm';
    return 'cloud';
}

/* ---------- Stations ----------
   urls : flux essayés dans l'ordre (bascule auto) — icone : clé de ICONS */
const stations = [
    { id: 'chantefrance', nom: 'Chante France', genre: 'Chanson française', icone: 'mic', urls: [
        'https://chantefrance.ice.infomaniak.ch/chantefrance-128.mp3',
        'https://stream.chantefrance.com/'
    ]},
    { id: 'cheriefm', nom: 'Chérie FM', genre: 'Pop / Love', icone: 'heart', urls: [
        'https://streaming.nrjaudio.fm/ouuku85n3nje'
    ]},
    { id: 'europe1', nom: 'Europe 1', genre: 'Talk / Info', icone: 'globe', urls: [
        'https://europe1.lmn.fm/europe1.mp3',
        'http://mp3lg3.scdn.arkena.com/10489/europe1.mp3'
    ]},
    { id: 'europe2', nom: 'Europe 2', genre: 'Pop / Rock', icone: 'star', urls: [
        'https://europe2.lmn.fm/europe2.mp3'
    ]},
    { id: 'francebleu', nom: 'France Bleu', genre: 'Info / Proximité', icone: 'pin', urls: [
        'https://icecast.radiofrance.fr/fbidf-midfi.mp3'
    ]},
    { id: 'funradio', nom: 'Fun Radio', genre: 'Dance / Hits', icone: 'phones', urls: [
        'https://icecast.funradio.fr/fun-1-44-128?listen=webCwsBCggNCQgLDQUGBAcGBg',
        'http://streaming.radio.funradio.fr/fun-1-44-128'
    ]},
    { id: 'nostalgie', nom: 'Nostalgie', genre: 'Variété / Oldies', icone: 'tape', urls: [
        'https://streaming.nrjaudio.fm/oug7girb92oc'
    ]},
    { id: 'nrj', nom: 'NRJ', genre: 'Hits / Pop', icone: 'bolt', urls: [
        'https://streaming.nrjaudio.fm/oumvmk8fnozc'
    ]},
    { id: 'ouifm', nom: 'OUI FM', genre: 'Rock', icone: 'pick', urls: [
        'https://ouifm.ice.infomaniak.ch/ouifm-high.mp3'
    ]},
    { id: 'rfm', nom: 'RFM', genre: 'Pop / Rock', icone: 'notes', urls: [
        'https://stream.rfm.fr/rfm.mp3',
        'http://rfm-live-mp3-128.scdn.arkena.com/rfm.mp3'
    ]},
    { id: 'rireetchansons', nom: 'Rire & Chansons', genre: 'Humour / Sketches', icone: 'smile', urls: [
        'https://streaming.nrjaudio.fm/ou8o8xgk7oiu',
        'https://streaming.nrjaudio.fm/oug7girb92oc'
    ]},
    { id: 'rmc', nom: 'RMC', genre: 'Talk / Info / Sport', icone: 'trophy', urls: [
        'https://audio.bfmtv.com/rmcradio_128.mp3'
    ]},
    { id: 'rtl2', nom: 'RTL2', genre: 'Pop / Rock', icone: 'vinyl', urls: [
        'https://icecast.rtl2.fr/rtl2-1-44-128?listen=webCwsBCggNCQgLDQUGBAcGBg',
        'http://streaming.radio.rtl2.fr/rtl2-1-44-128?listen=webCwsBCggNCQgLDQUGBAcGBg'
    ]},
    { id: 'skyrock', nom: 'Skyrock', genre: 'Rap / R&B', icone: 'rocket', urls: [
        'https://icecast.skyrock.net/s/natio_mp3_128k'
    ]}
];
stations.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));

/* ---------- Éléments ---------- */
const $ = id => document.getElementById(id);
const audio = $('audio'), grid = $('grid'), nowName = $('nowName'), track = $('track'),
      status = $('status'), eq = $('eq'), btnMain = $('btnMain'), art = $('art'),
      icoPlay = $('icoPlay'), icoStop = $('icoStop');

let currentId = null;
let urlIndex = 0;
let wakeLock = null;

$('brand').innerHTML = ico('radio') + 'Radios';
art.innerHTML = ico('radio');

/* ---------- Grille ---------- */
stations.forEach(s => {
    const b = document.createElement('button');
    b.className = 'card focusable';
    b.id = 'card-' + s.id;
    b.setAttribute('role', 'listitem');
    b.innerHTML =
        '<span class="mini"><i></i><i></i><i></i></span>' +
        '<span class="logo">' + ico(s.icone) + '</span>' +
        '<span class="txt"><span class="name"></span><span class="genre"></span></span>';
    b.querySelector('.name').textContent = s.nom;
    b.querySelector('.genre').textContent = s.genre;
    b.addEventListener('click', () => playStation(s.id));
    grid.appendChild(b);
});

/* ---------- Interface lecteur ---------- */
function setStatus(state, text) {
    status.className = 'status' + (state ? ' ' + state : '');
    status.textContent = text;
    const on = state === 'live', busy = on || state === 'load';
    eq.classList.toggle('on', on);
    icoPlay.style.display = busy ? 'none' : 'block';
    icoStop.style.display = busy ? 'block' : 'none';
    document.querySelectorAll('.card').forEach(c => {
        c.classList.toggle('playing', c.id === 'card-' + currentId && busy);
        c.classList.toggle('live', on);
    });
}
function isActive() { return !!audio.getAttribute('src'); }
function curStation() { return stations.find(x => x.id === currentId); }

/* Pochette / icône de la station */
function setArt(url) {
    const s = curStation();
    if (url) {
        art.innerHTML = '';
        const img = new Image();
        img.alt = '';
        img.onerror = () => { art.innerHTML = ico(s ? s.icone : 'radio'); };
        img.src = url;
        art.appendChild(img);
    } else {
        art.innerHTML = ico(s ? s.icone : 'radio');
    }
}
function showTrack(text) {
    if (text) { track.textContent = text; track.classList.remove('dim'); }
    else {
        const s = curStation();
        track.textContent = s && isActive() ? s.genre : '';
        track.classList.add('dim');
    }
}

/* ---------- Lecture ---------- */
function playStation(id) {
    const s = stations.find(x => x.id === id);
    if (!s) return;
    currentId = id;
    urlIndex = 0;
    try { localStorage.setItem('radio:last', id); } catch (e) {}
    nowName.textContent = s.nom;
    nowName.classList.remove('empty');
    lastTrackKey = '';
    setArt(null);
    showTrack(null);
    $('veilleName').textContent = s.nom;
    startCurrent();
    updateMediaSession(s);
}

function startCurrent() {
    const s = curStation();
    if (!s) return;
    setStatus('load', 'Connexion…');
    audio.src = s.urls[urlIndex];
    audio.load();
    const p = audio.play();
    if (p) p.catch(err => {
        if (err && err.name === 'AbortError') return;
        if (err && err.name === 'NotAllowedError') { setStatus('err', 'Lecture bloquée : appuyez sur OK'); return; }
        tryNextUrl();
    });
    requestWake();
}

function tryNextUrl() {
    const s = curStation();
    if (!s) return;
    if (urlIndex < s.urls.length - 1) { urlIndex++; startCurrent(); }
    else { stopAudio(true); setStatus('err', 'Flux indisponible'); }
}

function stopAudio(keepStatus) {
    stopMeta();
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    releaseWake();
    showTrack(null);
    setArt(null);
    if (!keepStatus) setStatus('', currentId ? 'À l\u2019arrêt' : 'Hors ligne');
}

function toggle() {
    if (!currentId) {
        const a = document.activeElement;
        const first = a && a.classList.contains('card') ? a.id.replace('card-', '') : stations[0].id;
        playStation(first);
        return;
    }
    if (isActive()) stopAudio(); else playStation(currentId);
}

function step(delta) {
    let i = stations.findIndex(s => s.id === currentId);
    if (i < 0) i = delta > 0 ? -1 : 0;
    const next = stations[(i + delta + stations.length) % stations.length];
    playStation(next.id);
    focusCard(next.id);
}

btnMain.addEventListener('click', toggle);
audio.addEventListener('playing', () => { setStatus('live', 'En direct'); startMeta(); });
audio.addEventListener('waiting', () => { if (isActive()) setStatus('load', 'Mise en mémoire…'); });
audio.addEventListener('error', () => { if (isActive()) tryNextUrl(); });
audio.addEventListener('stalled', () => {
    setTimeout(() => { if (isActive() && audio.readyState < 3 && !audio.paused) tryNextUrl(); }, 8000);
});

/* ---------- Titre en cours (métadonnées ICY) + pochette (iTunes) ----------
   Ne fonctionne que si le flux de la radio l'autorise (CORS). Sinon : on affiche le genre. */
let metaTimer = null, metaCtl = null, lastTrackKey = '';
const metaFail = new Set();

function startMeta() {
    stopMeta();
    if (metaFail.has(currentId)) return;
    pollMeta();
    metaTimer = setInterval(pollMeta, 25000);
}
function stopMeta() {
    clearInterval(metaTimer); metaTimer = null;
    if (metaCtl) { try { metaCtl.abort(); } catch (e) {} metaCtl = null; }
}

async function readIcy(url, signal) {
    const res = await fetch(url, { headers: { 'Icy-MetaData': '1' }, signal });
    const metaint = parseInt(res.headers.get('icy-metaint') || '0', 10);
    if (!metaint) { try { res.body.cancel(); } catch (e) {} throw new Error('pas de métadonnées'); }
    const reader = res.body.getReader();
    let buf = new Uint8Array(0);
    const push = c => { const n = new Uint8Array(buf.length + c.length); n.set(buf); n.set(c, buf.length); buf = n; };
    let need = metaint + 1;
    try {
        for (;;) {
            const { value, done } = await reader.read();
            if (done) return null;
            push(value);
            if (buf.length >= need && need === metaint + 1) {
                const len = buf[metaint] * 16;
                if (len === 0) return null;
                need = metaint + 1 + len;
            }
            if (buf.length >= need && need > metaint + 1) {
                const bytes = buf.slice(metaint + 1, need);
                let txt;
                try { txt = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
                catch (e) { txt = new TextDecoder('iso-8859-1').decode(bytes); }
                const m = txt.match(/StreamTitle='(.*?)';/);
                return m ? m[1].trim() : null;
            }
            if (buf.length > metaint + 5000) return null;
        }
    } finally { try { reader.cancel(); } catch (e) {} }
}

async function pollMeta() {
    const s = curStation();
    if (!s || !isActive()) return;
    const id = currentId;
    const ctl = new AbortController();
    metaCtl = ctl;
    const to = setTimeout(() => ctl.abort(), 12000);
    try {
        const raw = await readIcy(s.urls[urlIndex], ctl.signal);
        if (id === currentId && raw !== null) applyTitle(raw);
    } catch (e) {
        if (id === currentId && e.name !== 'AbortError') { metaFail.add(id); stopMeta(); }
    } finally { clearTimeout(to); }
}

const norm = t => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

function applyTitle(raw) {
    const s = curStation();
    const n = norm(raw);
    // on ignore les valeurs vides, le nom de la radio, les jingles/pubs génériques
    if (!s || n.length < 3 || n.includes(norm(s.nom)) || /^(unknown|inconnu|pub|publicite|advert)/.test(n)) {
        lastTrackKey = '';
        showTrack(null); setArt(null);
        return;
    }
    if (raw === lastTrackKey) return;
    lastTrackKey = raw;

    const i = raw.indexOf(' - ');
    const artist = i > 0 ? raw.slice(0, i).trim() : '';
    const title  = i > 0 ? raw.slice(i + 3).trim() : raw;
    showTrack(artist ? artist + ' \u2014 ' + title : title);
    setArt(null);
    if (artist) getCover(artist, title).then(url => { if (url && raw === lastTrackKey) setArt(url); });
}

const coverCache = new Map();
async function getCover(artist, title) {
    const key = artist + '|' + title;
    if (coverCache.has(key)) return coverCache.get(key);
    let url = null;
    try {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 8000);
        const r = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=5&country=FR&term=' +
            encodeURIComponent(artist + ' ' + title), { signal: ctl.signal });
        clearTimeout(to);
        const j = await r.json();
        const nt = norm(title), na = norm(artist);
        const hit = (j.results || []).find(x => {
            const t = norm(x.trackName), a = norm(x.artistName);
            return (t.includes(nt) || nt.includes(t)) && (a.includes(na) || na.includes(a));
        });
        if (hit && hit.artworkUrl100) url = hit.artworkUrl100.replace('100x100bb', '600x600bb');
    } catch (e) {}
    coverCache.set(key, url);
    return url;
}

/* ---------- Écran allumé pendant l'écoute ---------- */
async function requestWake() {
    try {
        if ('wakeLock' in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch (e) {}
}
function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isActive()) requestWake();
});

/* ---------- Commandes multimédia ---------- */
function updateMediaSession(s) {
    if (!('mediaSession' in navigator)) return;
    try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: s.nom, artist: s.genre, album: 'Radios' });
        navigator.mediaSession.setActionHandler('play', () => playStation(currentId));
        navigator.mediaSession.setActionHandler('pause', () => stopAudio());
        navigator.mediaSession.setActionHandler('stop', () => stopAudio());
        navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
        navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
    } catch (e) {}
}

/* ---------- Navigation à la télécommande ---------- */
function focusables() { return Array.from(document.querySelectorAll('.focusable')); }
function focusCard(id) {
    const el = $('card-' + id);
    if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function moveFocus(dir) {
    const items = focusables();
    const cur = document.activeElement;
    if (!items.includes(cur)) {
        const start = $('card-' + currentId) || items.find(i => i.classList.contains('card'));
        if (start) start.focus({ preventScroll: true });
        return;
    }
    const r = cur.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = null, bestScore = Infinity;

    items.forEach(el => {
        if (el === cur) return;
        const o = el.getBoundingClientRect();
        const dx = (o.left + o.width / 2) - cx;
        const dy = (o.top + o.height / 2) - cy;
        let main, side;
        if (dir === 'right') { if (dx <= r.width * 0.3) return; main = dx; side = Math.abs(dy); }
        if (dir === 'left')  { if (dx >= -r.width * 0.3) return; main = -dx; side = Math.abs(dy); }
        if (dir === 'down')  { if (dy <= r.height * 0.3) return; main = dy; side = Math.abs(dx); }
        if (dir === 'up')    { if (dy >= -r.height * 0.3) return; main = -dy; side = Math.abs(dx); }
        const score = main + side * 2.5;
        if (score < bestScore) { bestScore = score; best = el; }
    });

    if (!best && cur.classList.contains('card') && (dir === 'left' || dir === 'right')) {
        const cards = items.filter(i => i.classList.contains('card'));
        const i = cards.indexOf(cur);
        best = cards[(i + (dir === 'right' ? 1 : -1) + cards.length) % cards.length];
    }
    if (!best && cur.classList.contains('card') && dir === 'down') best = items.find(i => i.classList.contains('card'));

    if (best) {
        best.focus({ preventScroll: true });
        best.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
}

document.addEventListener('keydown', e => {
    const map = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
    if (map[e.key]) { e.preventDefault(); moveFocus(map[e.key]); return; }
    switch (e.key) {
        case 'MediaPlayPause': case 'MediaPlay': case 'MediaPause':
            e.preventDefault(); toggle(); break;
        case 'MediaStop':
            e.preventDefault(); stopAudio(); break;
        case 'MediaTrackNext': case 'ChannelUp': case 'PageDown':
            e.preventDefault(); step(1); break;
        case 'MediaTrackPrevious': case 'ChannelDown': case 'PageUp':
            e.preventDefault(); step(-1); break;
    }
});

/* ---------- Horloge ---------- */
const pad = n => String(n).padStart(2, '0');
let lastMinute = -1;
function tickClock() {
    const d = new Date();
    const m = d.getMinutes();
    if (m === lastMinute) return;
    lastMinute = m;
    const hhmm = pad(d.getHours()) + ':' + pad(m);
    $('clockTime').textContent = hhmm;
    $('veilleTime').textContent = hhmm;
    $('clockDate').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    if (veilleOn) placeVeille();   // l'heure change de place chaque minute (évite de marquer l'écran)
}
setInterval(tickClock, 1000);
tickClock();

/* ---------- Météo (Open-Meteo, sans clé) ---------- */
async function loadWeather() {
    try {
        const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.meteo.lat +
            '&longitude=' + CONFIG.meteo.lon +
            '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min' +
            '&timezone=Europe%2FParis&forecast_days=1';
        const r = await fetch(u);
        const j = await r.json();
        const t = Math.round(j.current.temperature_2m);
        $('wxTemp').textContent = t + '°';
        $('wxRange').textContent = Math.round(j.daily.temperature_2m_min[0]) + '° / ' + Math.round(j.daily.temperature_2m_max[0]) + '°';
        $('wxIco').innerHTML = WX[wxKind(j.current.weather_code)];
        $('wx').hidden = false;
    } catch (e) { /* on garde les dernières valeurs */ }
}
loadWeather();
setInterval(loadWeather, CONFIG.meteoRafraichirMin * 60000);

/* ---------- Mode veille ---------- */
const veille = $('veille'), veilleIn = $('veilleIn');
let veilleOn = false, veilleTimer = null, wokeAt = 0;

function armVeille() {
    clearTimeout(veilleTimer);
    veilleTimer = setTimeout(enterVeille, CONFIG.veilleMinutes * 60000);
}
function placeVeille() {
    veilleIn.style.left = (6 + Math.random() * 40) + '%';
    veilleIn.style.top  = (10 + Math.random() * 45) + '%';
}
function enterVeille() {
    veilleOn = true;
    const s = curStation();
    $('veilleName').textContent = s && isActive() ? s.nom : '';
    placeVeille();
    veille.hidden = false;
    document.body.classList.add('sleeping');
}
function wakeVeille() {
    veilleOn = false;
    veille.hidden = true;
    document.body.classList.remove('sleeping');
    wokeAt = Date.now();
    armVeille();
}
const passKeys = ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop', 'MediaTrackNext', 'MediaTrackPrevious', 'ChannelUp', 'ChannelDown'];

document.addEventListener('keydown', e => {
    if (veilleOn) {
        wakeVeille();
        // la première touche ne fait que réveiller l'écran (sauf commandes multimédia)
        if (!passKeys.includes(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); }
    } else armVeille();
}, true);
document.addEventListener('keyup', e => { if (Date.now() - wokeAt < 400) e.preventDefault(); }, true);
['mousedown', 'touchstart'].forEach(t => document.addEventListener(t, () => {
    if (veilleOn) wakeVeille(); else armVeille();
}, { capture: true, passive: true }));
document.addEventListener('click', e => {
    if (Date.now() - wokeAt < 400) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
document.addEventListener('mousemove', () => { if (veilleOn) wakeVeille(); }, { passive: true });
armVeille();

/* ---------- Curseur masqué ---------- */
let idleTimer;
function wakeCursor() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
document.addEventListener('mousemove', wakeCursor);
wakeCursor();

/* ---------- Démarrage : sélection sur la dernière station écoutée ---------- */
(function init() {
    let last = null;
    try { last = localStorage.getItem('radio:last'); } catch (e) {}
    const id = stations.some(s => s.id === last) ? last : stations[0].id;
    const el = $('card-' + id);
    if (el) el.focus({ preventScroll: true });
})();
</script>
